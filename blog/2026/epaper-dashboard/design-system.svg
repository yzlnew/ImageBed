<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">电子墨水屏 Dashboard 设计系统</title>
  <desc id="desc">展示固定画布、四种组件尺寸、字体职责、六种墨水语义色和无灰阶纹理。</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#1c1c1c"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 2 H10" stroke="#1c1c1c" stroke-width="2"/>
    </pattern>
    <pattern id="diag" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M2 0 V12" stroke="#1c1c1c" stroke-width="2"/>
    </pattern>
    <pattern id="cross" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 H16 M8 0 V16" stroke="#1c1c1c" stroke-width="1.6"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1c1c1c" flood-opacity=".07"/>
    </filter>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
      .serif{font-family:"Noto Serif SC","Songti SC",serif}
      .mono{font-family:"Space Mono","JetBrains Mono",monospace}
      .display{font-family:"Space Mono",monospace}
      .pixel{font-family:"Space Mono",monospace}
      .title{font-size:46px;font-weight:800;fill:#1c1c1c}
      .subtitle{font-size:20px;font-weight:600;fill:#58564f}
      .zone{font-size:15px;font-weight:800;letter-spacing:2px;fill:#58564f}
      .h2{font-size:24px;font-weight:800;fill:#1c1c1c}
      .h3{font-size:18px;font-weight:800;fill:#1c1c1c}
      .body{font-size:17px;font-weight:650;fill:#45433e}
      .small{font-size:14px;font-weight:700;fill:#58564f}
      .light{fill:#f4f2ec}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#f4f2ec"/>
  <rect x="24" y="24" width="1552" height="992" rx="26" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <text x="72" y="88" class="sans title">设计的不是网页，是 800×480 的物理印刷品</text>
  <text x="74" y="124" class="sans subtitle">同一个组件系统，同时接受黑白 1-bit 与六色 Spectra 6 的约束</text>

  <rect x="64" y="166" width="704" height="398" rx="22" fill="#fbfaf6" stroke="#1c1c1c" stroke-width="2" filter="url(#shadow)"/>
  <text x="94" y="208" class="mono zone">01 · FIXED CANVAS / 8PX GRID</text>
  <rect x="96" y="238" width="640" height="288" fill="#f4f2ec" stroke="#1c1c1c" stroke-width="4"/>
  <line x1="416" y1="238" x2="416" y2="526" stroke="#1c1c1c" stroke-width="8"/>
  <line x1="96" y1="382" x2="736" y2="382" stroke="#1c1c1c" stroke-width="8"/>
  <rect x="110" y="252" width="292" height="116" fill="#e6de3c"/>
  <rect x="430" y="252" width="292" height="116" fill="#3a7a4a"/>
  <rect x="110" y="396" width="292" height="116" fill="#2e4296"/>
  <rect x="430" y="396" width="292" height="116" fill="#b02a28"/>
  <text x="256" y="316" class="mono h3" text-anchor="middle">388×228</text>
  <text x="576" y="316" class="mono h3 light" text-anchor="middle">388×228</text>
  <text x="256" y="460" class="mono h3 light" text-anchor="middle">388×228</text>
  <text x="576" y="460" class="mono h3 light" text-anchor="middle">388×228</text>
  <text x="416" y="550" class="mono small" text-anchor="middle">8PX MARGIN · 8PX GUTTER · NO SCALING</text>

  <rect x="800" y="166" width="736" height="398" rx="22" fill="#fbfaf6" stroke="#1c1c1c" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="208" class="mono zone">02 · FOUR CANONICAL VIEWS</text>
  <g transform="translate(830 244)">
    <rect width="312" height="180" rx="12" fill="#f4f2ec" stroke="#1c1c1c" stroke-width="3"/>
    <rect x="12" y="12" width="288" height="132" fill="url(#dots)" stroke="#1c1c1c" stroke-width="2"/>
    <text x="156" y="169" class="mono small" text-anchor="middle">FULL · 2×2</text>
  </g>
  <g transform="translate(1176 244)">
    <rect width="328" height="82" rx="12" fill="#f4f2ec" stroke="#1c1c1c" stroke-width="3"/>
    <rect x="12" y="12" width="304" height="40" fill="url(#lines)" stroke="#1c1c1c" stroke-width="2"/>
    <text x="164" y="74" class="mono small" text-anchor="middle">HALF H · 2×1</text>
  </g>
  <g transform="translate(1176 354)">
    <rect width="156" height="180" rx="12" fill="#f4f2ec" stroke="#1c1c1c" stroke-width="3"/>
    <rect x="12" y="12" width="132" height="132" fill="url(#diag)" stroke="#1c1c1c" stroke-width="2"/>
    <text x="78" y="169" class="mono small" text-anchor="middle">HALF V</text>
  </g>
  <g transform="translate(1358 354)">
    <rect width="146" height="82" rx="12" fill="#f4f2ec" stroke="#1c1c1c" stroke-width="3"/>
    <rect x="12" y="12" width="122" height="40" fill="url(#cross)" stroke="#1c1c1c" stroke-width="2"/>
    <text x="73" y="74" class="mono small" text-anchor="middle">1×1</text>
  </g>
  <text x="1430" y="482" class="sans small" text-anchor="middle">每种尺寸重新排版</text>
  <text x="1430" y="506" class="sans small" text-anchor="middle">不是把 full 缩小</text>

  <rect x="64" y="598" width="470" height="362" rx="22" fill="#fbfaf6" stroke="#1c1c1c" stroke-width="2" filter="url(#shadow)"/>
  <text x="94" y="640" class="mono zone">03 · TYPE HAS A JOB</text>
  <text x="96" y="730" class="display" font-size="74" font-weight="700" fill="#1c1c1c">12:28</text>
  <text x="330" y="694" class="pixel h3">NOW PLAYING</text>
  <text x="330" y="726" class="mono small">SHORT LABEL / 12PX</text>
  <text x="96" y="792" class="sans" font-size="25" font-weight="700" fill="#1c1c1c">空气良好，所有设备正常</text>
  <text x="96" y="824" class="mono small">CHINESE BODY · 15PX+ / 600+</text>
  <text x="96" y="882" class="serif" font-size="27" font-weight="700" fill="#1c1c1c">给安静的页面留一点编辑感</text>
  <text x="96" y="916" class="mono small">EDITORIAL DISPLAY · SERIF</text>

  <rect x="566" y="598" width="518" height="362" rx="22" fill="#fbfaf6" stroke="#1c1c1c" stroke-width="2" filter="url(#shadow)"/>
  <text x="596" y="640" class="mono zone">04 · SIX SEMANTIC INKS</text>
  <g transform="translate(598 684)">
    <circle cx="34" cy="34" r="32" fill="#1c1c1c"/><text x="34" y="88" class="mono small" text-anchor="middle">INK</text>
    <circle cx="116" cy="34" r="32" fill="#f4f2ec" stroke="#1c1c1c" stroke-width="2"/><text x="116" y="88" class="mono small" text-anchor="middle">PAPER</text>
    <circle cx="198" cy="34" r="32" fill="#b02a28"/><text x="198" y="88" class="mono small" text-anchor="middle">ALERT</text>
    <circle cx="280" cy="34" r="32" fill="#3a7a4a"/><text x="280" y="88" class="mono small" text-anchor="middle">GOOD</text>
    <circle cx="362" cy="34" r="32" fill="#2e4296"/><text x="362" y="88" class="mono small" text-anchor="middle">INFO</text>
    <circle cx="444" cy="34" r="32" fill="#e6de3c"/><text x="444" y="88" class="mono small" text-anchor="middle">SUN</text>
  </g>
  <text x="598" y="824" class="sans h3">颜色先表达语义，再映射到面板</text>
  <rect x="598" y="850" width="212" height="54" rx="8" fill="#b02a28"/>
  <rect x="818" y="850" width="212" height="54" rx="8" fill="#1c1c1c"/>
  <text x="704" y="883" class="mono small light" text-anchor="middle">E6 · ALERT</text>
  <text x="924" y="883" class="mono small light" text-anchor="middle">BW · ALERT</text>
  <text x="598" y="932" class="sans small">BW 折叠颜色，但文字、图标和纹理保留含义</text>

  <rect x="1116" y="598" width="420" height="362" rx="22" fill="#fbfaf6" stroke="#1c1c1c" stroke-width="2" filter="url(#shadow)"/>
  <text x="1146" y="640" class="mono zone">05 · NO FAKE GRAY</text>
  <rect x="1148" y="680" width="156" height="92" fill="url(#dots)" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="1344" y="680" width="156" height="92" fill="url(#lines)" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="1148" y="814" width="156" height="92" fill="url(#diag)" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="1344" y="814" width="156" height="92" fill="url(#cross)" stroke="#1c1c1c" stroke-width="2"/>
  <text x="1226" y="794" class="mono small" text-anchor="middle">DOTS</text>
  <text x="1422" y="794" class="mono small" text-anchor="middle">LINES</text>
  <text x="1226" y="928" class="mono small" text-anchor="middle">DIAG</text>
  <text x="1422" y="928" class="mono small" text-anchor="middle">CROSS</text>
</svg>
